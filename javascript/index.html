<!DOCTYPE html>
<html>
	<head>
		<title>Javascript Exercise</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<button ton onclick="change()">Click me...</button>

		<div class="menu">Hello World!</div>

		<div class="gear"></div>

		<script>
			var menu = document.querySelector('-menu');
			var gear = document.querySelector('.gear');

			function change() {
				console.log('it works!');
				document.querySelector('-menu').classList.toggle('active');
				document.querySelector(" '-gear").classList.toggle('spin');
				document.body.classList.toggle('dark');
			}

			function glow() {
				console.log('we are glowing...');
				menu.classList.toggle('glow');
				gear.classList.toggle('glow');
			}
		</script>
	</body>
</html>
